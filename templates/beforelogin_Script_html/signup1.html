<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity Bridge | SignUp</title>
    <link rel="stylesheet" href="{{url_for('static',filename='beforelogin_Style_css/signup1.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='headerfooter/footer.css')}}"/>
    <link rel="stylesheet" href="{{url_for('static',filename='headerfooter/header.css')}}" />
    <link rel="shortcut icon" href="{{url_for('static',filename='images/faviconlogo.jpeg')}}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">
        <div class="container nav">
            <div class="logo">
                <img src="{{url_for('static',filename='images/projectlogo.png')}}" alt="logo">
                <span>Humanity Bridge</span>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav>   
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/ourwork">Our work</a>
                <a href="/gallery">Gallery</a>
                <a href="/login" class="login-btn">Login / SignUp</a>
            </nav>
        </div>
    </header>

    <section class="signup-wrapper">
        <div class="signup-card">

            <div class="card-header">
                <div class="card-logo">
                    <img src="{{url_for('static',filename='images/projectlogo.png')}}" alt="Logo">
                    <h3>Humanity Bridge</h3>
                </div>
                <h2>Create Your Account</h2>
                <p>Join us in making a difference through responsible giving.</p>
            </div>

            <form class="signup-form" id="unifiedSignupForm">
                
                <div class="role-selection">
                    <label>Select Your Role:</label>
                    <div class="role-radio-group">
                        <label class="role-radio">
                            <input type="radio" name="role" value="donor" checked>
                            <span><i class="fa-solid fa-hand-holding-heart"></i> Individual Donor</span>
                        </label>

                        <label class="role-radio">
                            <input type="radio" name="role" value="volunteer">
                            <span><i class="fa-solid fa-hands-helping"></i> Volunteer</span>
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="Name" name="name" placeholder="Name" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-phone"></i>
                    <input type="text" id="Phone" name="phone" placeholder="Phone" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="Email" name="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="City" name="city" placeholder="City" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-map-pin"></i>
                    <input type="text" id="Pincode" name="pincode" placeholder="Pincode" required>
                </div>



                <div id="fields_volunteer" class="dynamic-fields" style="display: none;">
                    <div class="input-group">
                        <i class="fa-solid fa-car"></i>
                        <select id="Vehicle" name="vehicle_type">
                            <option value="" disabled selected>Select Vehicle Type</option>
                            <option value="car">Car</option>
                            <option value="motorcycle">Motorcycle</option>
                            <option value="bicycle">Bicycle</option>
                            <option value="none">No Vehicle (Public Transport)</option>
                        </select>
                    </div>
                    <!-- <div class="input-group" style="align-items: flex-start;">
                        <i class="fa-solid fa-clock" style="top: 22px;"></i>
                        <textarea id="volAvailability" placeholder="Your Availability (e.g., Weekends, Evenings, Afternoons)" rows="2"></textarea>
                    </div> -->
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="Password" name="password" placeholder="Password" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="ConfirmPassword" name="confirm_password" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="submit-btn">Sign Up</button>
                <p class="login-link">Already have an account? <a href="/login">Login</a></p>

            </form>

        </div>
    </section>

    <footer>
        <p>© 2026 Humanity Bridge. All Rights Reserved.</p>
    </footer>

    <script src="{{url_for('static',filename='headerfooter/nav.js')}}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const roleRadios = document.querySelectorAll('input[name="role"]');
            
            const fieldsVolunteer = document.getElementById('fields_volunteer');
            
            const updateDynamicFields = () => {
                const selectedRole = document.querySelector('input[name="role"]:checked').value;
                
                fieldsVolunteer.style.display = 'none';
                
                document.getElementById('volVehicle').required = false;
                
                if (selectedRole === 'volunteer') {
                    fieldsVolunteer.style.display = 'block';
                    document.getElementById('volVehicle').required = true;
                }
            };
            
            roleRadios.forEach(radio => {
                radio.addEventListener('change', updateDynamicFields);
            });
            
            document.getElementById('unifiedSignupForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const pwd = document.getElementById('commonPassword').value;
                const confirmPwd = document.getElementById('commonConfirmPassword').value;
                
                if (pwd !== confirmPwd) {
                    alert("Passwords do not match!");
                    return;
                }
                
                const selectedRole = document.querySelector('input[name="role"]:checked').value;
                alert("Sign Up successful as " + selectedRole + "!\n\nRedirecting to login...");
                
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            });
            
            updateDynamicFields();
        });
    </script>
</body>

</html>
