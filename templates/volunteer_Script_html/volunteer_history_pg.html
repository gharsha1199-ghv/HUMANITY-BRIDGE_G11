<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity Bridge | Delivery History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='headerfooter/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='regulardonar_Style_css/donation_history_pg.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='headerfooter/footer.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/faviconlogo.jpeg') }}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container nav">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/projectlogo.png') }}" alt="logo">
                <span>Humanity Bridge</span>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav>
                <a href="/volunteerhome">Home</a>
                <a href="/volunteerorders">Orders</a>
                <a href="/volunteertracking">Tracking</a>
                <a href="/volunteermyaccount">My Account</a>
                <div class="user-dropdown">
                    <a href="#" class="login-btn user-toggle">Volunteer &#9662;</a>
                    <div class="dropdown-content">
                        <a href="/volunteerhome">View Dashboard</a>
                        <a href="/volunteervolunteer_history">Delivery History</a>
                        <a href="/volunteermyaccount">My Account</a>
                        <a href="/login">Logout</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <section class="dashboard-container">
        <div class="title-section">
            <h1>Delivery History</h1>
            <div class="shining-line"></div>
        </div>

        <div class="history-content-wrapper">
            <div class="months-container">
                <div class="history-table-container" id="history-table-container" style="display: block;">
                    <h3 id="selected-month-title">Month History</h3>
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Date</th>
                                <th>Delivery Task</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 Humanity Bridge. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const selectedMonthTitle = document.getElementById("selected-month-title");
            const historyTableBody = document.getElementById("history-table-body");

            const urlParams = new URLSearchParams(window.location.search);
            const monthName = urlParams.get('month') || 'All Time';

            selectedMonthTitle.innerText = `${monthName} History`;

            const donationHistory = {
                "January": [
                    { sno: 1, date: "12 Jan 2026", task: "Deliver Food to Shelter A", status: "Completed" },
                    { sno: 2, date: "28 Jan 2026", task: "Pickup Clothes from Donor B", status: "Completed" }
                ],
                "March": [
                    { sno: 1, date: "15 Mar 2026", task: "Deliver Medical Supplies", status: "Completed" }
                ]
            };

            const history = donationHistory[monthName] || [];
            
            if (history.length > 0) {
                history.forEach(item => {
                    historyTableBody.innerHTML += `
                        <tr>
                            <td>${item.sno}</td>
                            <td>${item.date}</td>
                            <td>${item.task}</td>
                            <td><span style="color: lightgreen;">${item.status}</span></td>
                        </tr>
                    `;
                });
            } else {
                historyTableBody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; color: #ccc;">No deliveries this month</td>
                    </tr>
                `;
            }
        });
    </script>
    <script src="{{ url_for('static', filename='headerfooter/nav.js') }}"></script>
</body>
</html>
