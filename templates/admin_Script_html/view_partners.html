<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity Bridge | View Partners</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='headerfooter/header.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='headerfooter/footer.css') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/faviconlogo.jpeg') }}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(120deg, #4e025f, #831b9a);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .view-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 120px 20px 60px 20px;
        }

        .view-card {
            background: white;
            width: 100%;
            max-width: 900px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-logo img {
            width: 40px;
        }

        .card-logo h3 {
            color: #2a044a;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card-header-row h2 {
            color: #4e025f;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .card-header-row .back-btn {
            color: #831b9a;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-header-row .back-btn:hover {
            color: #ffc107;
        }

        .filters-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .filter-tabs {
            display: flex;
            background: #f0edf5;
            padding: 4px;
            border-radius: 30px;
            gap: 5px;
        }

        .filter-tab {
            background: transparent;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #666;
            transition: all 0.3s;
        }

        .filter-tab.active {
            background: #831b9a;
            color: white;
            box-shadow: 0 2px 10px rgba(131, 27, 154, 0.3);
        }

        .partner-search {
            position: relative;
            flex-grow: 1;
            max-width: 300px;
        }

        .partner-search i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .partner-search input {
            width: 100%;
            padding: 10px 15px 10px 42px;
            border: 1.5px solid #e0d4fc;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
            background: #fcfbfe;
        }

        .partner-search input:focus {
            border-color: #831b9a;
            background: #fff;
            box-shadow: 0 0 8px rgba(131, 27, 154, 0.2);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            border: 1.5px solid #e0d4fc;
        }

        .partner-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 600px;
        }

        .partner-table th {
            background: #f5eff8;
            color: #4e025f;
            font-weight: 600;
            text-align: left;
            padding: 14px 16px;
        }

        .partner-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #e0d4fc;
            color: #333;
            background: #fff;
        }

        .partner-table tr:last-child td {
            border-bottom: none;
        }

        .partner-table tr:hover td {
            background-color: #faf7fc;
        }

        .partner-type-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .partner-type-badge.donor {
            background-color: rgba(131, 27, 154, 0.1);
            color: #831b9a;
        }

        .partner-type-badge.ngo {
            background-color: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container nav">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/projectlogo.png') }}" alt="logo">
                <span>Humanity Bridge</span>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav>
                <a href="/adminadd_partner" class="login-btn">Add Partners</a>
                <a href="/adminview_partners" class="login-btn active">View Partners</a>
                <div class="user-dropdown">
                    <a href="#" class="login-btn user-toggle">Admin &#9662;</a>
                    <div class="dropdown-content">
                        <a href="/adminhome">View Dashboard</a>
                        <a href="/adminadmin_history">System History</a>
                        <a href="/adminmyaccount">My Account</a>
                        <a href="/login">Logout</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <section class="view-wrapper">
        <div class="view-card">
            <div class="card-logo">
                <img src="{{ url_for('static', filename='images/projectlogo.png') }}" alt="Logo">
                <h3>Humanity Bridge</h3>
            </div>

            <div class="card-header-row">
                <h2>Partner Directory</h2>
                <a href="/adminhome" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
            </div>

            <div class="filters-bar">
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="filterPartners('all', this)">All Partners</button>
                    <button class="filter-tab" onclick="filterPartners('donor', this)">Regular Donors</button>
                    <button class="filter-tab" onclick="filterPartners('ngo', this)">NGOs / Receivers</button>
                </div>

                <div class="partner-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="partnerSearchInput" placeholder="Search partners..."
                        oninput="handlePartnerSearch()">
                </div>
            </div>

            <div class="table-container">
                <table class="partner-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Contact</th>
                            <th>Location</th>
                            <th>Reg. Number</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="partnerTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 Humanity Bridge. All Rights Reserved.</p>
    </footer>

    <script>
        const dbPartners = {{ db_partners | tojson | safe }} || [];

        let currentFilter = 'all';

        function getPartners() {
            return dbPartners;
        }

        function renderPartnersTable(searchText = '') {
            const tbody = document.getElementById('partnerTableBody');
            tbody.innerHTML = '';

            const partners = getPartners();

            const filtered = partners.filter(p => {
                if (currentFilter !== 'all' && p.type !== currentFilter) return false;

                if (searchText) {
                    const search = searchText.toLowerCase();
                    return p.name.toLowerCase().includes(search) ||
                        p.contact.toLowerCase().includes(search) ||
                        p.city.toLowerCase().includes(search) ||
                        p.area.toLowerCase().includes(search) ||
                        p.regNum.toLowerCase().includes(search);
                }
                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888; padding: 25px; background: #fff;">No partners found matching the filter.</td></tr>`;
                return;
            }

            filtered.forEach(p => {
                const tr = document.createElement('tr');

                const typeLabel = p.type === 'donor' ? `Regular Donor (${p.orgType})` : 'NGO / Receiver';
                const typeClass = p.type === 'donor' ? 'donor' : 'ngo';

                tr.innerHTML = `
                    <td><strong>${p.name}</strong></td>
                    <td><span class="partner-type-badge ${typeClass}">${typeLabel}</span></td>
                    <td>${p.contact}</td>
                    <td>${p.city} (${p.area})</td>
                    <td>${p.regNum}</td>
                    <td><span style="color: #28a745; font-weight: 600;"><i class="fa-solid fa-circle-check"></i> ${p.status}</span></td>
                `;
                tbody.appendChild(tr);
            });

            // Add total row at the end of the table
            const totalTr = document.createElement('tr');
            totalTr.innerHTML = `
                <td style="font-weight: bold; background: #f8f5fd; color: #4e025f;">Total Partners</td>
                <td colspan="5" style="font-weight: bold; background: #f8f5fd; color: #831b9a;">${filtered.length}</td>
            `;
            tbody.appendChild(totalTr);
        }

        // Toggles type filtering
        function filterPartners(type, btnElement) {
            currentFilter = type;

            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            btnElement.classList.add('active');

            document.getElementById('partnerSearchInput').value = '';
            renderPartnersTable();
        }

        // Handles search input typing
        function handlePartnerSearch() {
            const searchText = document.getElementById('partnerSearchInput').value;
            renderPartnersTable(searchText);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderPartnersTable();
        });
    </script>
    <script src="{{ url_for('static', filename='headerfooter/nav.js') }}"></script>
</body>

</html>
