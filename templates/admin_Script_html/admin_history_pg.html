<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity Bridge | System History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='headerfooter/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='regulardonar_Style_css/donation_history_pg.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='headerfooter/footer.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/faviconlogo.jpeg') }}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container nav">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/projectlogo.png') }}" alt="logo">
                <span>Humanity Bridge</span>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav>
                <a href="/adminadd_partner" class="login-btn">Add Partners</a>
                <a href="/adminview_partners" class="login-btn">View Partners</a>
                <div class="user-dropdown">
                    <a href="#" class="login-btn user-toggle">Admin &#9662;</a>
                    <div class="dropdown-content">
                        <a href="/adminhome">View Dashboard</a>
                        <a href="/adminadmin_history">System History</a>
                        <a href="/adminmyaccount">My Account</a>
                        <a href="/login">Logout</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <section class="dashboard-container">
        <div class="title-section">
            <h1>System History</h1>
            <div class="shining-line"></div>
        </div>

        <div class="history-content-wrapper">
            <div class="months-container">
                <div class="months-grid">
                    <div class="month-btn" data-month="All Time" onclick="window.location.href='?month=All+Time'">All Time</div>
                    <div class="month-btn" data-month="January" onclick="window.location.href='?month=January'">Jan</div>
                    <div class="month-btn" data-month="February" onclick="window.location.href='?month=February'">Feb</div>
                    <div class="month-btn" data-month="March" onclick="window.location.href='?month=March'">Mar</div>
                    <div class="month-btn" data-month="April" onclick="window.location.href='?month=April'">Apr</div>
                    <div class="month-btn" data-month="May" onclick="window.location.href='?month=May'">May</div>
                    <div class="month-btn" data-month="June" onclick="window.location.href='?month=June'">Jun</div>
                    <div class="month-btn" data-month="July" onclick="window.location.href='?month=July'">Jul</div>
                    <div class="month-btn" data-month="August" onclick="window.location.href='?month=August'">Aug</div>
                    <div class="month-btn" data-month="September" onclick="window.location.href='?month=September'">Sep</div>
                    <div class="month-btn" data-month="October" onclick="window.location.href='?month=October'">Oct</div>
                    <div class="month-btn" data-month="November" onclick="window.location.href='?month=November'">Nov</div>
                    <div class="month-btn" data-month="December" onclick="window.location.href='?month=December'">Dec</div>
                </div>
                <div class="history-table-container" id="history-table-container" style="display: block;">
                    <h3 id="selected-month-title">Month History</h3>
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Date</th>
                                <th>Action</th>
                                <th>User/Entity</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 Humanity Bridge. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const selectedMonthTitle = document.getElementById("selected-month-title");
            const historyTableBody = document.getElementById("history-table-body");

            const urlParams = new URLSearchParams(window.location.search);
            const monthName = urlParams.get('month') || 'All Time';

            selectedMonthTitle.innerText = `${monthName} History`;

            const donationHistory = {
                "January": [
                    { sno: 1, date: "10 Jan 2026", action: "Approved Request", user: "Hope Orphanage", details: "Approved food supply" },
                    { sno: 2, date: "22 Jan 2026", action: "Added User", user: "Santhosh Dhaba", details: "Registered as Donor" }
                ],
                "March": [
                    { sno: 1, date: "05 Mar 2026", action: "Assigned Volunteer", user: "Volunteer #142", details: "Delivery route to Shelter A" }
                ]
            };

            // Set active class on month buttons
            const monthButtons = document.querySelectorAll('.month-btn');
            monthButtons.forEach(btn => {
                const btnMonthName = btn.getAttribute('data-month');
                if (btnMonthName === monthName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            let history = [];
            if (monthName === 'All Time') {
                let count = 1;
                Object.keys(donationHistory).forEach(month => {
                    donationHistory[month].forEach(item => {
                        history.push({
                            sno: count++,
                            date: item.date,
                            action: item.action,
                            user: item.user,
                            details: item.details
                        });
                    });
                });
            } else {
                history = donationHistory[monthName] || [];
            }
            
            if (history.length > 0) {
                history.forEach(item => {
                    historyTableBody.innerHTML += `
                        <tr>
                            <td>${item.sno}</td>
                            <td>${item.date}</td>
                            <td>${item.action}</td>
                            <td>${item.user}</td>
                            <td>${item.details}</td>
                        </tr>
                    `;
                });
            } else {
                historyTableBody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; color: #ccc;">No system actions this month</td>
                    </tr>
                `;
            }
        });
    </script>
    <script src="{{ url_for('static', filename='headerfooter/nav.js') }}"></script>
</body>
</html>
