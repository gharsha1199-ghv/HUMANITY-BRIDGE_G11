<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity Bridge | Request History</title>
    <link rel="stylesheet" href="../../components/headerfooter/header.css">
    <link rel="stylesheet" href="../../assets/regulardonar_Style_css/donation_history_pg.css">
    <link rel="stylesheet" href="../../components/headerfooter/footer.css">
    <link rel="shortcut icon" href="../../assets/images/faviconlogo.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container nav">
            <div class="logo">
                <img src="../../assets/images/projectlogo.png" alt="logo">
                <span>Humanity Bridge</span>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav id="nav">
                <a href="index.html">Home</a>
                <a href="about_pg.html">About</a>
                <a href="ourwork_pg.html">Our Work</a>
                <a href="gallery_pg.html">Gallery</a>
                <div class="user-dropdown">
                    <a href="#" class="login-btn user-toggle">Orphanage &#9662;</a>
                    <div class="dropdown-content">
                        <a href="recieverdash.html">View Dashboard</a>
                        <a href="ngo_history_pg.html">Request History</a>
                        <a href="myaccount_pg.html">My Account</a>
                        <a href="../../pages/beforelogin_Script_html/login_pg.html">Logout</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <section class="dashboard-container">
        <div class="title-section">
            <h1>Request History</h1>
            <div class="shining-line"></div>
        </div>

        <div class="history-content-wrapper">
            <div class="months-container">
                <div class="history-table-container" id="history-table-container" style="display: block;">
                    <h3 id="selected-month-title">Month History</h3>
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Date</th>
                                <th>Request Type</th>
                                <th>Received Item</th>
                                <th>Quantity</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 Humanity Bridge. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const selectedMonthTitle = document.getElementById("selected-month-title");
            const historyTableBody = document.getElementById("history-table-body");

            // Parse URL params
            const urlParams = new URLSearchParams(window.location.search);
            const monthName = urlParams.get('month') || 'All Time';

            selectedMonthTitle.innerText = `${monthName} History`;

            // Dummy history data for demonstration
            const donationHistory = {
                "January": [
                    { sno: 1, date: "10 Jan 2026", type: "Food Request", item: "Rice & Lentils", quantity: "50 kg" },
                    { sno: 2, date: "22 Jan 2026", type: "Clothes Request", item: "Winter Coats", quantity: "20 pieces" }
                ],
                "March": [
                    { sno: 1, date: "05 Mar 2026", type: "Fund Request", item: "Medical Bills", quantity: "$200" }
                ]
            };

            const history = donationHistory[monthName] || [];
            
            if (history.length > 0) {
                history.forEach(item => {
                    historyTableBody.innerHTML += `
                        <tr>
                            <td>${item.sno}</td>
                            <td>${item.date}</td>
                            <td>${item.type}</td>
                            <td>${item.item}</td>
                            <td>${item.quantity}</td>
                        </tr>
                    `;
                });
            } else {
                historyTableBody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; color: #ccc;">No requests this month</td>
                    </tr>
                `;
            }
        });
    </script>
    <script src="../../components/headerfooter/nav.js"></script>
</body>
</html>
